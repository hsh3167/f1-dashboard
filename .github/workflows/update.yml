    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
  schedule:
    # UTC ���� 3�ð� ����, �Ž� 17�� (�ѱ��ð� 00/03/06/...�� 17��).
    - cron: '17 */3 * * *'
  workflow_dispatch:        # ����� Actions �ǿ��� ���� ���� ����

permissions:
  contents: write

concurrency:
  group: f1-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ��� ó�� ȸ�� �׽�Ʈ
        run: python3 -m unittest discover -s tests -v

      - name: ������ ����
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/update.py

      - name: ����� Ŀ��
        run: |
          if ! git diff --quiet -- data/live.json; then
            git config user.name  "f1-bot"
            git config user.email "actions@github.com"
            git add data/live.json
            git commit -m "chore: F1 ������ �ڵ� ���� ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          else
